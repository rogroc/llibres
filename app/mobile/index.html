<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Llibreviu - Escàner Mòbil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://unpkg.com/tesseract.js@5.0.3/dist/tesseract.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "/npm/": "https://cdn.jsdelivr.net/npm/",
      "/npm/onnxruntime-web@1.24.3/+esm": "./ort_proxy.js",
      "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.24.3/+esm": "./ort_proxy.js",
      "/npm/@techstark/opencv-js@%5E4.10.0-release.1/+esm": "./opencv_proxy.js",
      "https://cdn.jsdelivr.net/npm/@techstark/opencv-js@%5E4.10.0-release.1/+esm": "./opencv_proxy.js",
      "/npm/@techstark/opencv-js@^4.10.0-release.1/+esm": "./opencv_proxy.js",
      "https://cdn.jsdelivr.net/npm/@techstark/opencv-js@^4.10.0-release.1/+esm": "./opencv_proxy.js",
      "/npm/@techstark/opencv-js@4.10.0-release.1/+esm": "./opencv_proxy.js",
      "https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/+esm": "./opencv_proxy.js"
    }
  }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="header" style="position: relative; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <h2 style="margin: 0; font-size: 1.2rem; color: #fff;">Llibreviu Scanner</h2>
        <div style="display: flex; gap: 12px; align-items: center;">
          <button id="btn-show-pc" style="background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer; padding: 5px; line-height: 1;" title="Veure a la pantalla de l'ordinador">💻</button>
          <button id="btn-settings-gear" style="display: none; background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer; padding: 5px; line-height: 1;">⚙️</button>
        </div>
      </div>
      <div class="toggle-container" style="width: 100%;">
        <button id="mode-isbn" class="toggle-btn active">ISBN (Codi / Text)</button>
        <button id="mode-portada" class="toggle-btn">Portada (OCR)</button>
      </div>
    </header>

    <main class="main-content">
      <div id="status-message" class="status-message">Toca per iniciar la càmera</div>
      <div style="text-align: center; display: flex; justify-content: center; align-items: center; gap: 10px; margin: 10px auto; width: 100%; max-width: 500px;">
        <button id="btn-toggle-camera" style="display: none; padding: 8px 16px; border-radius: 20px; border: 1px solid #3498db; background: #ebf5fb; color: #2980b9; font-weight: bold; cursor: pointer; font-size: 0.85rem; align-items: center; justify-content: center; gap: 6px;">
          📷 Desactivar Càmera
        </button>
        <div id="switch-flash-container" class="switch-container" style="display: none;">
          <span>⚡ Flash automàtic</span>
          <label class="switch">
            <input type="checkbox" id="chk-auto-flash">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <!-- ISBN Scanner View -->
      <div id="scanner-view" class="view active">
        <div id="reader" style="width: 100%; border-radius: 8px; overflow: hidden;"></div>
      </div>

      <!-- Portada OCR View -->
      <div id="ocr-view" class="view" style="flex-direction: column; width: 100%; align-items: center;">
        <div style="width: 100%; text-align: center;">
          <video id="ocr-video" autoplay playsinline muted style="width: 100%; max-height: 50vh; object-fit: contain; border-radius: 8px; display: none;"></video>
          <canvas id="ocr-canvas" style="display:none;"></canvas>
          <div id="ocr-preview-container" style="display:none; margin-top:10px;">
            <img id="ocr-preview" style="width:100%; max-height: 50vh; object-fit: contain; border-radius:8px;" />
          </div>
        </div>
        <button id="btn-take-photo" class="btn-primary" style="display:none; margin-top: 20px; width: 90%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.15);">📷 Enviar Portada a l'Ordinador</button>
      </div>

      <!-- Searching View -->
      <div id="searching-view" class="view" style="display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; width: 100%; box-sizing: border-box;">
        <div class="spinner"></div>
        <h3 style="margin-top: 20px; color: #2c3e50; font-size: 1.25rem;">Cercant als catàlegs...</h3>
        <p style="color: #7f8c8d; font-size: 0.9rem; margin-top: 8px;">L'ordinador de treball està consultant les bases de dades de llibres.</p>
      </div>

      <!-- Selection View -->
      <div id="selection-view" class="view" style="display: none; flex-direction: column; width: 100%; box-sizing: border-box; padding: 10px;">
        <h3 style="text-align: center; color: #2c3e50; margin: 0 0 15px 0; font-size: 1.2rem;">Selecciona el llibre correcte</h3>
        <div id="candidates-list" style="width: 100%; display: flex; flex-direction: column; gap: 12px; max-height: 60vh; overflow-y: auto; padding: 4px; box-sizing: border-box;">
          <!-- Dinàmicament omplert per JS -->
        </div>
        <button id="btn-cancel-selection" class="btn-secondary" style="margin-top: 15px; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; border: 1px solid #ccc; background: #fdfefe; color: #2c3e50; cursor: pointer;">Tornar a escanejar</button>
      </div>

      <!-- Editing View -->
      <div id="editing-view" class="view" style="display: none; flex-direction: column; width: 100%; max-width: 500px; margin: 0 auto; box-sizing: border-box; padding: 10px;">
        <h3 style="text-align: center; color: #2c3e50; margin: 0 0 15px 0; font-size: 1.2rem;">Revisa i desa la fitxa</h3>
        <form id="mobile-edit-form" style="width: 100%; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box;">
          <!-- Secció de portada del llibre -->
          <div id="cover-field-section" style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 15px; border-radius: 10px; background: #1e1e1e; border: 1px solid #333; margin-bottom: 5px; box-sizing: border-box;">
            <label style="align-self: flex-start; font-size: 0.75rem; color: #3498db; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 2px;">Imatge de la Portada</label>
            <div id="cover-preview-wrapper" style="width: 100%; display: flex; justify-content: center; align-items: center; min-height: 120px; background: #121212; border: 1px dashed #555; border-radius: 8px; overflow: hidden; position: relative;">
              <img id="form-cover-preview" style="max-height: 150px; object-fit: contain; display: none;" />
              <span id="form-cover-placeholder" style="color: #777; font-size: 0.85rem; text-align: center; padding: 10px;">Sense portada</span>
            </div>
            <button type="button" id="btn-trigger-cover-capture" class="btn-secondary" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.9rem; padding: 10px; background: #34495e;">
              📷 Fotografiar portada
            </button>
          </div>

          <div id="form-fields-container" style="width: 100%; display: flex; flex-direction: column; gap: 12px; max-height: 55vh; overflow-y: auto; padding: 4px; box-sizing: border-box;">
            <!-- Camps dinàmics (titol, autor, etc.) -->
          </div>
          <button type="button" id="btn-toggle-pc-lock" style="width: 100%; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.95rem; transition: all 0.2s ease; margin-top: 5px;">
            🔒 Ordinador Bloquejat
          </button>
          <div style="display: flex; gap: 10px; margin-top: 15px; width: 100%;">
            <button type="button" id="btn-save-form" class="btn-primary" style="flex: 2; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; border: none; background: #27ae60; color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">💾 Desar a BD</button>
            <button type="button" id="btn-cancel-edit" class="btn-secondary" style="flex: 1; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; border: 1px solid #ccc; background: #fdfefe; color: #2c3e50;">Cancel·lar</button>
          </div>
        </form>
      </div>

      <!-- Outcome View -->
      <div id="outcome-view" class="view" style="display: none; flex-direction: column; align-items: center; justify-content: center; padding: 45px 20px; text-align: center; width: 100%; box-sizing: border-box;">
        <div id="outcome-icon" style="font-size: 4.5rem; margin-bottom: 15px; user-select: none;"></div>
        <h3 id="outcome-title" style="margin: 0 0 10px 0; color: #2c3e50; font-size: 1.3rem;"></h3>
        <p id="outcome-message" style="color: #7f8c8d; font-size: 0.95rem; line-height: 1.4; margin: 0;"></p>
      </div>
      
      <div id="start-overlay" class="overlay">
        <button id="btn-start" class="btn-primary btn-large">📷 Activar Càmera</button>
        <p style="margin-top: 10px; color: #7f8c8d; font-size: 0.9rem;">Requereix permisos al navegador</p>
      </div>

      <!-- Cover Capture Overlay -->
      <div id="cover-capture-overlay" class="overlay" style="display: none; flex-direction: column; align-items: center; justify-content: flex-start; z-index: 1000; padding: 0; background: #000; position: fixed; top: 0; left: 0; right: 0; bottom: 0;">
        <!-- Contenidor per centrar la càmera verticalment a l'espai superior -->
        <div style="flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; margin-bottom: 110px;">
          <!-- Visor amb proporció 1:1.6 (5:8) de portades de Llibreviu -->
          <div style="position: relative; width: 270px; height: 432px; overflow: hidden; border-radius: 12px; border: 3px solid #fff; box-shadow: 0 8px 24px rgba(0,0,0,0.8); background: #000;">
            <video id="cover-video" autoplay playsinline muted style="width: 100%; height: 100%; object-fit: cover;"></video>
            <!-- Quadre de línia discontínua per orientar millor l'enquadrament de la portada -->
            <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; border: 2px dashed rgba(255,255,255,0.5); pointer-events: none; margin: 15px; border-radius: 6px;"></div>
          </div>
        </div>
        <canvas id="cover-canvas" style="display: none;"></canvas>
        
        <!-- Controls de baix (alçada fixed 110px per sincronitzar amb el margin-bottom) -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 110px; display: flex; align-items: center; justify-content: space-around; padding-bottom: 10px; z-index: 10; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); box-sizing: border-box;">
          <button type="button" id="btn-cancel-cover-capture" style="background: none; border: none; color: #fff; font-size: 1rem; font-weight: bold; cursor: pointer; padding: 10px; width: 100px; text-align: center;">✕ Cancel·lar</button>
          
          <button type="button" id="btn-do-capture-cover" style="width: 76px; height: 76px; border-radius: 50%; background: #fff; border: 6px solid #444; box-shadow: 0 0 0 4px #fff, 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: transform 0.1s;">
            <div style="width: 54px; height: 54px; border-radius: 50%; background: #e74c3c;"></div>
          </button>
          
          <div style="width: 100px; display: flex; justify-content: center;">
            <button type="button" id="btn-toggle-cover-flash" style="display: none; background: rgba(255,255,255,0.2); border: none; border-radius: 50%; width: 44px; height: 44px; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; color: #fff; padding: 0; margin: 0;">
              ⚡
            </button>
          </div>
        </div>
      </div>

      <div id="settings-overlay" class="overlay" style="display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; padding: 20px;">
        <div style="background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 20px; width: 95%; max-width: 400px; box-sizing: border-box; text-align: left; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
          <h3 style="margin-top: 0; color: #fff; border-bottom: 1px solid #333; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 1.15rem;">
            <span>Configuració OCR</span>
            <button id="btn-close-settings" style="background: none; border: none; color: #7f8c8d; font-size: 1.4rem; cursor: pointer; line-height: 1; padding: 0 5px;">✕</button>
          </h3>
          <div style="margin: 20px 0; display: flex; flex-direction: column; gap: 15px;">
            <div>
              <label for="sel-ocr-engine" style="color: #fff; display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.95rem;">Motor d'OCR:</label>
              <select id="sel-ocr-engine" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 0.88rem; box-sizing: border-box; cursor: pointer;">
                <option value="gemini-api" selected>Gemini 3.1 Flash Lite (Online AI)</option>
                <option value="local-hybrid">PaddleOCR + Tesseract (Híbrid local)</option>
                <option value="local-tesseract">Tesseract local (Més ràpid offline)</option>
              </select>
            </div>
            <div id="gemini-key-container">
              <label for="txt-gemini-key" style="color: #fff; display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.95rem;">Clau API Gemini:</label>
              <input type="text" id="txt-gemini-key" value="" placeholder="AIzaSy..." style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 0.88rem; box-sizing: border-box;">
            </div>
          </div>
          <button type="button" id="btn-save-settings" class="btn-primary" style="width: 100%; margin-top: 10px; background: #3498db;">Desar Configuració</button>
        </div>
      </div>
    </main>
  </div>
  <!-- Debug Log Console -->
  <div id="debug-log" style="display: none; position: fixed; bottom: 0; left: 0; right: 0; height: 150px; background: rgba(0, 0, 0, 0.9); color: #00ffcc; font-family: monospace; font-size: 11px; overflow-y: scroll; z-index: 10000; border-top: 2px solid #00ffcc; padding: 5px; box-sizing: border-box;">
    <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 3px; margin-bottom: 5px; color: #fff; font-weight: bold;">
      <span>DEBUG LOGS</span>
      <button onclick="document.getElementById('debug-log').style.display='none'" style="background: red; color: white; border: none; padding: 2px 6px; cursor: pointer; border-radius: 3px; font-size: 10px;">Close</button>
    </div>
    <div id="debug-log-content"></div>
  </div>
  <button id="btn-toggle-debug" style="position: fixed; bottom: 5px; right: 5px; z-index: 9999; background: #333; color: #fff; border: 1px solid #555; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; opacity: 0.6;">Debug</button>
  <script src="app.js?v=32"></script>
</body>
</html>
