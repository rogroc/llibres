<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Llibreviu - Escàner Mòbil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://unpkg.com/tesseract.js@5.0.3/dist/tesseract.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "/npm/": "https://cdn.jsdelivr.net/npm/",
      "/npm/onnxruntime-web@1.24.3/+esm": "./ort_proxy.js",
      "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.24.3/+esm": "./ort_proxy.js",
      "/npm/@techstark/opencv-js@%5E4.10.0-release.1/+esm": "./opencv_proxy.js",
      "https://cdn.jsdelivr.net/npm/@techstark/opencv-js@%5E4.10.0-release.1/+esm": "./opencv_proxy.js",
      "/npm/@techstark/opencv-js@^4.10.0-release.1/+esm": "./opencv_proxy.js",
      "https://cdn.jsdelivr.net/npm/@techstark/opencv-js@^4.10.0-release.1/+esm": "./opencv_proxy.js",
      "/npm/@techstark/opencv-js@4.10.0-release.1/+esm": "./opencv_proxy.js",
      "https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/+esm": "./opencv_proxy.js"
    }
  }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h2>Llibreviu Scanner</h2>
      <div class="toggle-container">
        <button id="mode-isbn" class="toggle-btn active">ISBN (Codi / Text)</button>
        <button id="mode-portada" class="toggle-btn">Portada (OCR)</button>
      </div>
    </header>

    <main class="main-content">
      <div id="status-message" class="status-message">Toca per iniciar la càmera</div>
      <div style="text-align: center; display: flex; justify-content: center; gap: 10px; margin: 10px auto; width: 100%; max-width: 500px;">
        <button id="btn-toggle-camera" style="display: none; padding: 8px 16px; border-radius: 20px; border: 1px solid #3498db; background: #ebf5fb; color: #2980b9; font-weight: bold; cursor: pointer; font-size: 0.85rem; align-items: center; justify-content: center; gap: 6px;">
          📷 Desactivar Càmera
        </button>
        <button id="btn-flash" style="display: none; padding: 8px 16px; border-radius: 20px; border: 1px solid #f1c40f; background: #fffbeb; color: #d35400; font-weight: bold; cursor: pointer; font-size: 0.85rem; align-items: center; justify-content: center; gap: 6px;">
          💡 Encendre Flash
        </button>
      </div>

      <!-- ISBN Scanner View -->
      <div id="scanner-view" class="view active">
        <div id="reader" style="width: 100%; border-radius: 8px; overflow: hidden;"></div>
      </div>

      <!-- Portada OCR View -->
      <div id="ocr-view" class="view" style="flex-direction: column; width: 100%; align-items: center;">
        <div style="width: 100%; text-align: center;">
          <video id="ocr-video" autoplay playsinline style="width: 100%; max-height: 50vh; object-fit: contain; border-radius: 8px; display: none;"></video>
          <canvas id="ocr-canvas" style="display:none;"></canvas>
          <div id="ocr-preview-container" style="display:none; margin-top:10px;">
            <img id="ocr-preview" style="width:100%; max-height: 50vh; object-fit: contain; border-radius:8px;" />
          </div>
        </div>
        <button id="btn-take-photo" class="btn-primary" style="display:none; margin-top: 20px; width: 90%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.15);">📷 Enviar Portada a l'Ordinador</button>
      </div>
      
      <div id="start-overlay" class="overlay">
        <button id="btn-start" class="btn-primary btn-large">📷 Activar Càmera</button>
        <p style="margin-top: 10px; color: #7f8c8d; font-size: 0.9rem;">Requereix permisos al navegador</p>
      </div>
    </main>
  </div>
  <!-- Debug Log Console -->
  <div id="debug-log" style="display: none; position: fixed; bottom: 0; left: 0; right: 0; height: 150px; background: rgba(0, 0, 0, 0.9); color: #00ffcc; font-family: monospace; font-size: 11px; overflow-y: scroll; z-index: 10000; border-top: 2px solid #00ffcc; padding: 5px; box-sizing: border-box;">
    <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 3px; margin-bottom: 5px; color: #fff; font-weight: bold;">
      <span>DEBUG LOGS</span>
      <button onclick="document.getElementById('debug-log').style.display='none'" style="background: red; color: white; border: none; padding: 2px 6px; cursor: pointer; border-radius: 3px; font-size: 10px;">Close</button>
    </div>
    <div id="debug-log-content"></div>
  </div>
  <button id="btn-toggle-debug" style="position: fixed; bottom: 5px; right: 5px; z-index: 9999; background: #333; color: #fff; border: 1px solid #555; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; opacity: 0.6;">Debug</button>
  <script src="app.js?v=21"></script>
</body>
</html>
